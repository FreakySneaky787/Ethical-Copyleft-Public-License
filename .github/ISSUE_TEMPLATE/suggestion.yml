name: Suggestion for a future version
description: Propose a change to the terms of the ECPL
labels: ["suggestion"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the situation the current text does not handle well.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Which section, and how would you change it?
    validations:
      required: true
